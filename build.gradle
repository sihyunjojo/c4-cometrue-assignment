project(':transfer-domain') {
    dependencies {
        implementation 'org.springframework:spring-context'
        implementation "org.springframework.boot:spring-boot-starter-data-jpa" // jakarta.persistenc 예외

        implementation project(':member-domain')
        implementation project(':main-account-domain')
        implementation project(':saving-account-domain')
