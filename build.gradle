    dependencies {
        implementation project(':common')
        implementation project(':transfer-log-domain')
        implementation project(':dlq-domain')

        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    }
}

//---- 🌟 Domain Layer ----
project(':member-domain') {
