plugins {
    id 'java'
    id 'checkstyle'
    id 'io.spring.dependency-management' version "${gradleDependencyManagementVersion}" apply false
    id 'org.springframework.boot' version "${springBootVersion}" apply false
}

group = 'com.c4cometrue'

subprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.toVersion(javaVersion)
        targetCompatibility = JavaVersion.toVersion(javaVersion)
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
    }

    lombokDependencies(project)
    slf4jDependencies(project)

    // ✅ Checkstyle
    checkstyle {
        configFile = file("${rootDir}/naver-checkstyle.xml")
        configProperties = ["suppressionFile": "${rootDir}/naver-checkstyle-suppressions.xml"]
        toolVersion = checkstyleVersion
    }

    // ✅ JUnit 5 설정
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

def slf4jDependencies(Project project) {
    project.dependencies {
        implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    }
}
def lombokDependencies(Project project) {
    project.dependencies {
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    }
}


// 데이터베이스 의존성 추가
def databaseDependencies(Project project, String db = 'oracle') {
    project.dependencies {
        if (db == 'oracle') {
            runtimeOnly "com.oracle.database.jdbc:ojdbc8:${oracleVersion}"
        } else if (db == 'mysql') {
            runtimeOnly "mysql:mysql-connector-java:${mysqlVersion}"
        }
    }
}

// QueryDSL 설정을 위한 공통 함수
def configureQueryDsl(Project project) {
    def querydslDir = project.layout.buildDirectory.dir("generated/querydsl").get().asFile

    sourceSets {
        main {
            java {
                srcDir querydslDir
            }
        }
    }

    project.configurations {
        querydsl.extendsFrom compileClasspath
    }

    project.tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ["-parameters"]
        options.getGeneratedSourceOutputDirectory().set(querydslDir)
    }

    project.tasks.named("clean").configure {
        doFirst {
            delete querydslDir
        }
    }

    // QueryDSL 관련 태스크 의존성 명시적 설정
    project.tasks.matching { it.name == 'compileJava' }.configureEach {
        dependsOn project.tasks.matching { it.name.contains('querydsl') }
    }

    project.dependencies {
        implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
        annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
        annotationProcessor "jakarta.annotation:jakarta.annotation-api:${jakartaAnnotationVersion}"
        annotationProcessor "jakarta.persistence:jakarta.persistence-api:${jakartaPersistenceVersion}"
    }
}

//---- 🏗️  Infra Layer ----
project(':member-infra') {
    configureQueryDsl(project)
    databaseDependencies(project)

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

        implementation project(':common')
        implementation project(':member-domain')
    }
}

project(':main-account-infra') {
    configureQueryDsl(project)
    databaseDependencies(project)

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-validation'

        implementation project(':common')
        implementation project(':main-account-domain')
        implementation project(':member-infra')
    }
}

project(':saving-account-infra') {
    configureQueryDsl(project)
    databaseDependencies(project)

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-validation'

        implementation project(':common')
        implementation project(':saving-account-domain')
        implementation project(':main-account-infra')
        implementation project(':member-infra')
    }
}

project(':transfer-infra') {
    configureQueryDsl(project)
    databaseDependencies(project)

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

        implementation project(':common')
        implementation project(':transfer-domain')
        implementation project(':member-domain')
        implementation project(':member-infra')
        implementation project(':main-account-infra')
        implementation project(':saving-account-infra')
    }
}

project(':transfer-log-infra') {
    configureQueryDsl(project)
    databaseDependencies(project)

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

        implementation project(':common')
