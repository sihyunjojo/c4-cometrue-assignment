//---- 🌐 Interface Layer ----
project(':interface') {
    dependencies {
        implementation "org.springframework.boot:spring-boot-starter-data-jpa"

        // swagger
        implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

        // Mapper
        implementation "org.mapstruct:mapstruct:${mapstructVersion}"
        annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

        implementation project(':main-account-domain')
        implementation project(':member-domain')
        implementation project(':reminder')
        implementation project(':saving-account-domain')
        implementation project(':settlement-domain')
        implementation project(':transfer-domain')
        implementation project(':transfer-log-domain')
        implementation project(':dlq-domain')
        implementation project(':dlq-infra')  // 🔥 이 라인 추가
        implementation project(':common')
    }
}

project(':batch') {
    dependencies {
        implementation project(':interface')
        implementation project(':dlq-domain')
        implementation project(':transfer-log-domain')
        implementation project(':common')

        implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
        implementation "org.springframework.boot:spring-boot-starter-batch"
    }
}

//---- 📚 Common Layer ----
project(':common') {
    dependencies {
