        implementation 'org.springframework.boot:spring-boot-starter-actuator'

        // Micrometer Prometheus Registry: Actuator 메트릭을 Prometheus 형식으로 변환
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

        // logstash
        implementation "net.logstash.logback:logstash-logback-encoder:${logstashVersion}"

        // swagger
        implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

        // Spring Data JPA
        implementation "org.springframework.boot:spring-boot-starter-data-jpa"

        // Test Dependencies
//        testImplementation platform("org.springframework.boot:spring-boot-dependencies")
//        testImplementation 'org.springframework.boot:spring-boot-starter-test'
//        testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
//        testImplementation "org.assertj:assertj-core:${assertjVersion}"
//
//        // Lombok for test
//        testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
//        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

        implementation project(':main-account-domain')
        implementation project(':main-account-infra')
        implementation project(':saving-account-domain')
        implementation project(':saving-account-infra')
        implementation project(':transfer-domain')
        implementation project(':transfer-infra')
        implementation project(':transfer-log-domain')
        implementation project(':transfer-log-infra')
        implementation project(':dlq-domain')
        implementation project(':dlq-infra')
        implementation project(':interface')
        implementation project(':common')
        implementation project(':batch')
